{% extends "base.html" %}
{% block title %}Connexion admin{% endblock %}

{% block topbar_right %}
<div class="topbar-right">
    <a href="{{ url_for('formulaire') }}" class="btn btn-outline btn-sm" data-c="blue" title="Formulaire de suivi">
        <i class="ti ti-clipboard-heart"></i> <span class="btn-label">Formulaire de suivi</span>
    </a>
    <a href="{{ url_for('etat') }}" class="btn btn-outline btn-sm" data-c="blue" title="État des mannequins">
        <i class="ti ti-activity-heartbeat"></i> <span class="btn-label">État des mannequins</span>
    </a>
</div>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box card">
        <div class="card-head"><i class="ti ti-shield-lock"></i> Connexion administrateur</div>
        <div class="card-body">
            <form method="POST">
                <div class="field">
                    <label class="label">Mot de passe</label>
                    <input type="password" class="input" name="password" required autofocus>
                </div>
                <button type="submit" class="btn-submit"><i class="ti ti-login"></i> Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
